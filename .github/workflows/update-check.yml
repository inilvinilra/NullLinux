name: Update Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nvchecker
        run: pip install nvchecker

      - name: Run nvchecker
        run: nvchecker -c .nvchecker/nvchecker.toml

      - name: Compare versions
        run: |
          nvcmp -c .nvchecker/nvchecker.toml || true
          if [[ -f .nvchecker/newver.json ]]; then
            diff .nvchecker/oldver.json .nvchecker/newver.json || true
          fi

      - name: Commit updated versions
        run: |
          if [[ -f .nvchecker/newver.json ]]; then
            cp .nvchecker/newver.json .nvchecker/oldver.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .nvchecker/oldver.json
            git diff --cached --quiet || git commit -m "chore: update tracked package versions"
            git push || true
          fi

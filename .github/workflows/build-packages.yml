name: Build Packages

on:
  push:
    branches: [main]
    paths:
      - "src/roles/**/PKGBUILD"
      - "src/tools/**/PKGBUILD"
  workflow_dispatch:

# Pull requests deliberately do not build packages: a PKGBUILD from a fork is
# untrusted code, and makepkg would execute it. PRs are validated by ci.yml.

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel namcap

      - name: Build and inspect every metapackage
        run: |
          useradd -m builder
          chown -R builder:builder .
          failed=0
          for dir in src/roles/*/ src/tools/*/; do
            [[ -f "$dir/PKGBUILD" ]] || continue
            echo "── $dir"
            su builder -c "cd '$dir' && makepkg -f --noconfirm --nodeps --noextract" || { failed=1; continue; }
            su builder -c "cd '$dir' && namcap PKGBUILD" || true
          done
          exit $failed

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nulllinux-metapackages
          path: src/**/*.pkg.tar.zst
          retention-days: 30

LABEL nulllinux
MENU LABEL Null Linux Live (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 nvme_load=yes

LABEL nulllinux-safe
MENU LABEL Null Linux Live (Safe Graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset quiet loglevel=3

LABEL nulllinux-nvidia
MENU LABEL Null Linux Live (NVIDIA)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nouveau.modeset=0 quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 nvme_load=yes

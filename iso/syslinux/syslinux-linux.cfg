LABEL nulllinux
MENU LABEL Null Linux Live ISO (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.show_status=1 loglevel=4 rd.udev.log_level=4 console=tty1 console=ttyS0,115200n8

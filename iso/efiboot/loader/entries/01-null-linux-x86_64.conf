title   Null Linux Live ISO (x86_64, UEFI)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.show_status=1 loglevel=4 rd.udev.log_level=4 console=tty1 console=ttyS0,115200n8
